<script>
// パソコンのスプレッドシートのパネル（NotifyPanel.html の中）で開いたとき：
// シートの行へ移動するなどの操作を、入れ物（Apps Script）に頼む橋渡し
(function(){
  if(new URLSearchParams(location.search).get('gas')!=='1' || window.parent===window || window.google) return;
  var pend={}, seq=0;
  window.addEventListener('message',function(e){
    if(e.source!==window.parent) return; var m=e.data||{}; if(m.arkGas!==1||!pend[m.id]) return;
    var h=pend[m.id]; delete pend[m.id];
    if(m.ok){ if(h.s) h.s(m.v); } else if(h.f) h.f(new Error(m.err||'エラー'));
  });
  function runner(){
    var h={s:null,f:null}, o={};
    o.withSuccessHandler=function(fn){ h.s=fn; return p; };
    o.withFailureHandler=function(fn){ h.f=fn; return p; };
    var p=new Proxy(o,{get:function(t,k){ if(k in t) return t[k]; return function(){ var id=++seq; pend[id]=h; window.parent.postMessage({arkGas:1,id:id,fn:String(k),args:[].slice.call(arguments)},'*'); }; }});
    return p;
  }
  window.google={script:{get run(){ return runner(); }}};
})();
</script>

const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const md = s => { const m = String(s||'').match(/^\d{4}-(\d{2})-(\d{2})/); return m ? `${+m[1]}/${+m[2]}` : (s||''); };
const who = e => e ? String(e).split('@')[0] : '';

function toast(t, ms=2600){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'), ms); }
function plateNum(p){ const z = String(p||'').normalize('NFKC'); const m = z.match(/(\d{1,2}[-\s]?\d{2}|\d{1,4})\s*$/); return m ? m[1].replace(/[-\s]/g,'') : ''; }
// 車種名の表示をそろえる：全角→半角、英数字のあいだの「－ー‐−」は「-」に（N－ＢＯＸ → N-BOX、Ｎ－ＷＧＮ → N-WGN）

function carLabel(j){ return [carName(j.car), j.plate ? plateNum(j.plate) || j.plate : ''].filter(Boolean).join(' ') || '（登録番号未入力）'; }
function stepNext(j){ for(const s of STEPS){ const st=j.steps&&j.steps[s.k]; if(st&&st.need&&!st.done) return s; } return null; }
function tsOf(v){ if(!v) return 0; if(typeof v.toMillis==='function') return v.toMillis(); const t=Date.parse(v); return isNaN(t)?0:t; }

// ───────── 変更の見分け（作業ボード） ─────────
function diffJob(prev, cur, id=''){

    if(o && o.status!==p.status && !pIn){

function hashId(t){ let h1=0x811c9dc5, h2=0x1505; for(let i=0;i<t.length;i++){ const c=t.charCodeAt(i); h1=Math.imul(h1^c,16777619)>>>0; h2=(Math.imul(h2,33)+c)>>>0; } return h1.toString(36)+h2.toString(36); }

function push(evs, live){
  evs = evs.filter(e => !HIDDEN.has(hideKey(e)));
  if(!evs.length) return;
  const now = Date.now();
  evs.forEach((e,i)=>{ e.ts = e.ts || now; e.id = e.id || (now+'-'+Math.random().toString(36).slice(2,7)+i); e.live = !!live; });
  // 入力途中の連続更新は1件にまとめる（同じ車両・同じ種類・5分以内）
  const mks = new Set(evs.filter(e=>e.mk).map(e=>e.mk));
  const keep = S.events.filter(e => !(e.mk && mks.has(e.mk) && now - e.ts < 5*60000));
  const lim = Date.now() - KEEP_DAYS*864e5;
  S.events = evs.concat(keep).filter(e=>e.ts>=lim).sort((a,b)=>b.ts-a.ts).slice(0, MAX_EV);
  ls.set('ark-ev', S.events.map(({live,...e})=>e));
  // 音を鳴らすのは「音なし」でない通知が1件でもあるときだけ
  const loud = evs.filter(e=>!e.quiet && !e.mine);   // この端末での操作から生まれた通知は音を鳴らさない
  if(live && loud.length){ beep(loud); }
  if(live){ const n = evs.filter(e=>!e.mine).length; if(n) hubSend({ark:'new', n}); }   // この端末での操作は数えない
  if(live && loud.length) deskNotify(loud);
  renderFeed(); renderBadge();
}

    <span class="pill" style="background:${pc}">${esc(pill)}</span><span class="x">${esc(carLabel(j))}</span>${extra}</div>`;
  let h = '';
  const sec = (title, n) => `<div class="sec">${title}<span class="n">${n}台</span></div>`;
  if(late.length){ h += sec('⏰ 納期遅れ', late.length); late.forEach(j=>{ h += row(j, md(j.dueDate), '#d93025', `<span class="late">${esc(stepNext(j).n)}</span>`); }); }
  h += sec('📅 今日が納期', due.length); due.forEach(j=>{ const n=stepNext(j); h += row(j, n?n.n:'完成', n?n.c:DONE_C); });
  if(!due.length) h += `<div class="d" style="padding:4px 10px;color:var(--sub)">なし</div>`;
  h += sec('🚗 完成・納車待ち', ready.length); ready.forEach(j=>{ h += row(j, '完成', DONE_C, j.dueDate?`<span class="d">${md(j.dueDate)}</span>`:''); });
  if(parts.length){ h += sec('📦 部品待ち', parts.length); parts.forEach(j=>{ const w=(j.parts||[]).filter(p=>p.status==='未発注'||p.status==='発注済'); h += row(j, w[0].status, w[0].status==='未発注'?'#d93025':'#f29900', `<span class="d">${esc(w.map(p=>p.name).join('・'))}</span>`); }); }
  h += `<div class="sec">🔧 工程ごとの台数<span class="n">作業中 ${jobs.length-ready.length}台</span></div>`;
  byStep.forEach(({s,js})=>{ h += `<div class="row" style="cursor:default"><span class="pill" style="background:${s.c}">${esc(s.n)}</span><span class="x">${js.map(carLabel).map(esc).join('、')}</span><b>${js.length}</b></div>`; });
  $('todayView').innerHTML = sheetHtml() + `<div class="sec" style="margin-top:18px;color:var(--sub)">── 作業ボード ──</div>` + (jobs.length ? h : `<div class="note">作業ボードの作業指示が届いていません（${S.stat.jobs?S.stat.jobs.n:0}件）。作業ボードの「設定」タブでチーム共有にログインすると表示されます。</div>`);
}

const SRC_NAME = {wb:'作業ボード', est:'見積り', loan:'代車', daily:'朝の入庫予定', msg:'コメント', sheet:'シート'};
S.snd = Object.assign({vol:60, wb:'chime', est:'pinpon', loan:'up', daily:'up', msg:'bell', sheet:'pop'}, ls.get('ark-snd', {}));
const CUSTOM = {};   // src → objectURL（自分で選んだ音声ファイル）

// 好きな音声ファイルは IndexedDB に保存（この端末のブラウザ内だけ）
function idb(){ return new Promise((ok,ng)=>{ try{ const r=indexedDB.open('ark-notify',1); r.onupgradeneeded=()=>r.result.createObjectStore('snd'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error); }catch(e){ ng(e); } }); }
async function idbPut(k,v){ const db=await idb(); return new Promise((ok,ng)=>{ const t=db.transaction('snd','readwrite'); v==null?t.objectStore('snd').delete(k):t.objectStore('snd').put(v,k); t.oncomplete=ok; t.onerror=()=>ng(t.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((ok,ng)=>{ const r=db.transaction('snd').objectStore('snd').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error); }); }
async function loadCustom(){ for(const k of Object.keys(SRC_NAME)){ try{ const b=await idbGet('custom-'+k); if(b){ CUSTOM[k]={url:URL.createObjectURL(b.blob), name:b.name}; } }catch(e){} } }

function playSynth(key, vol){
  const def = SOUNDS[key]; if(!def || !def.notes) return;
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  const t0 = actx.currentTime + .02, peak = Math.max(.0002, .35 * vol);
  for(const [f, st, len, type] of def.notes){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t0+st);
    g.gain.exponentialRampToValueAtTime(type==='square'?peak*.35:peak, t0+st+.015);
    g.gain.exponentialRampToValueAtTime(.0001, t0+st+len);
    o.connect(g).connect(actx.destination); o.start(t0+st); o.stop(t0+st+len+.05);
  }
}
function playSound(src, force){
  if(!S.sound && !force) return;
  const key = S.snd[src] || 'chime', vol = (+S.snd.vol||0)/100;
  if(key==='none' || vol<=0) return;
  try{
    if(key==='custom' && CUSTOM[src]){ const a=new Audio(CUSTOM[src].url); a.volume=Math.min(1,vol); a.play().catch(()=>{}); return; }
    if(SOUNDS[key] && SOUNDS[key].file){ const a=new Audio(SOUNDS[key].file); a.volume=Math.min(1,vol); a.play().catch(()=>{}); return; }
    playSynth(key==='custom'?'chime':key, vol);
  }catch(e){}
}
// 複数まとめて届いたときは1回だけ鳴らす（優先：代車 → 見積り → 作業ボード）
function beep(evs){
  const srcs = new Set((evs||[]).map(e=>e.src));
  if(!srcs.has('loan') && !srcs.has('est') && !srcs.has('wb') && !srcs.has('daily') && !srcs.has('msg')) return;   // シートだけなら鳴らさない
  playSound(srcs.has('msg')?'msg':srcs.has('daily')?'daily':srcs.has('loan')?'loan':srcs.has('est')?'est':'wb');
}

function renderSoundPanel(){
  const opts = cur => Object.entries(SOUNDS).map(([k,v])=>`<option value="${k}"${cur===k?' selected':''}>${v.n}</option>`).join('')
    + `<option value="custom"${cur==='custom'?' selected':''}>好きな音（ファイル）</option><option value="none"${cur==='none'?' selected':''}>鳴らさない</option>`;
  $('sndBody').innerHTML = `
    <label class="sw"><input type="checkbox" id="sndOn"${S.sound?' checked':''}> 通知音を鳴らす</label>
    <div class="sl">音量 <input type="range" id="sndVol" min="0" max="100" value="${S.snd.vol}"> <span id="sndVolN">${S.snd.vol}</span></div>
    ${Object.entries(SRC_NAME).filter(([k])=>k!=='sheet').map(([k,n])=>`
      <div class="sr"><div class="sh"><span class="src ${k}">${n}</span><button class="chip" data-test="${k}">▶ 試す</button></div>
        <select data-src="${k}">${opts(S.snd[k])}</select>
        ${S.snd[k]==='custom'?`<div class="cf">${CUSTOM[k]?`🎵 ${esc(CUSTOM[k].name)}`:'ファイルが未選択です'}
          <label class="chip">ファイルを選ぶ<input type="file" accept="audio/*" data-file="${k}" hidden></label>
          ${CUSTOM[k]?`<button class="chip" data-unset="${k}">外す</button>`:''}</div>`:''}
      </div>`).join('')}
    <div class="d" style="color:var(--sub);margin-top:8px;line-height:1.5">好きな音は mp3・wav・m4a などが使えます（3MBまで）。このパソコンのブラウザに保存されます。</div>`;
}

// ───────── シートの該当行へ ─────────
function jump(num, car){
  if(!num && !car){ return; }
  if(!(window.google && google.script && google.script.run)){ toast('（プレビュー）シートの行を探します：'+[car,num].join(' ')); return; }
  google.script.run.withSuccessHandler(r=>{
    toast(r ? `「${r.sheet}」の ${r.row} 行目を選択しました` : 'このシートには該当する車両が見つかりませんでした');
  }).withFailureHandler(e=>toast('行を探せませんでした：'+(e&&e.message||e))).findRow(num, car);
}

// ───────── Firebase ─────────
let fb, app, auth, db;
async function boot(){
  try{
    const [A, U, F] = await Promise.all([import(FB+'firebase-app.js'), import(FB+'firebase-auth.js'), import(FB+'firebase-firestore.js')]);
    fb = {A,U,F};
    app = A.getApps().find(a=>a.name==='notify') || A.initializeApp(CFG, 'notify');
    try{ auth = U.initializeAuth(app, {persistence:[U.indexedDBLocalPersistence, U.browserLocalPersistence, U.inMemoryPersistence]}); }
    catch(e){ auth = U.getAuth(app); }
    try{ db = F.initializeFirestore(app, {experimentalAutoDetectLongPolling:true}); }catch(e){ db = F.getFirestore(app); }
    U.onAuthStateChanged(auth, u => { S.user = u; u ? start() : showLogin(); });
  }catch(e){
    showLogin(); $('loginErr').textContent = 'Firebaseを読み込めませんでした：' + (e&&e.message||e);
  }
}
function bootDone(){ window.__ARK_READY=true; const b=$('boot'); if(b) b.remove(); }
function showLogin(){ bootDone(); stop(); $('app').style.display='none'; $('login').style.display=''; }

async function login(){
  const em = $('em').value.trim(), pw = $('pw').value;
  if(!em || !pw){ $('loginErr').textContent='メールアドレスとパスワードを入れてください'; return; }
  $('loginBtn').disabled = true; $('loginErr').textContent='';
  try{ await fb.U.signInWithEmailAndPassword(auth, em, pw); $('pw').value=''; }
  catch(e){
    const c = String(e&&e.code||'') + ' ' + String(e&&e.message||'');
    $('loginErr').textContent =
      /invalid|wrong|not-found|credential/.test(c) ? 'メールアドレスかパスワードが違います' :
      /too-many/.test(c) ? 'しばらく時間をおいてからお試しください' :
      /referer|referrer|blocked/.test(c) ? 'APIキーの「ウェブサイトの制限」でブロックされています。\nGoogle Cloud コンソールで *.googleusercontent.com を許可してください（設定手順を参照）。' :
      'ログインできませんでした：' + c;
  }finally{ $('loginBtn').disabled = false; }
}

function listen(name, onSnap){
  const {F} = fb;
  S.first[name] = true;
  S.unsubs.push(F.onSnapshot(F.collection(db, name), snap => {
    const first = S.first[name]; S.first[name] = false;
    onSnap(snap, first);
    // パネルを閉じている間に削除されたものも、開いたときに通知から消す
    if(first){ const ids = new Set(); snap.docChanges().forEach(ch=>{ const v=ch.doc.data()||{}; if(ch.type!=='removed' && !v.deleted && !v._sheet) ids.add(name+'/'+ch.doc.id); });
      dropWhere(e => e.ref && e.ref.startsWith(name+'/') && !ids.has(e.ref)); }
    // 受信状況（切り分け用）：件数・最後に変更を受け取った時刻
    S.stat[name] = S.stat[name] || {n:0, last:0, log:[]};
    const st = S.stat[name]; st.n = name==='jobs' ? Object.keys(S.jobs).length : (snap.size != null ? snap.size : st.n);
    if(!first){ st.last = Date.now(); snap.docChanges().forEach(ch=>{ const d=ch.doc.data()||{}; st.log.unshift(`${new Date().toLocaleTimeString('ja-JP')} ${ch.type} ${d.car||''} ${d.plate||''} by ${who(d.by)}`); }); st.log = st.log.slice(0,30); }
    const j = S.stat.jobs || {n:0,last:0};
    if(S.errs && Object.keys(S.errs).length){ setStatus(Object.values(S.errs)[0], 'err'); return; }
    setStatus(`受信中 ・ 作業指示 ${j.n}件${j.last?` ・ 最終 ${new Date(j.last).toLocaleTimeString('ja-JP')}`:' ・ 変更待ち'}`, 'on');
    if(S.tab==='today') renderToday();
  }, err => {
    if(name==='estimates' && /permission/.test(String(err&&err.code))){ S.estDenied = true; renderFeed(); return; }
    if(name==='sheet' && /permission/.test(String(err&&err.code))){ S.sheetDenied = true; return; }
    if(name==='daily' && /permission/.test(String(err&&err.code))){ S.dailyDenied = true; return; }
    if(name==='comments' && /permission/.test(String(err&&err.code))){ S.cmtDenied = true; return; }   // ルールに daily がなくても他の通知は動かす   // ルール未設定でも他の通知は動かす
    S.errs = S.errs || {};
    S.errs[name] = /permission/.test(String(err&&err.code)) ? `${name==='jobs'?'作業ボード':name} を読む権限がありません（Firestoreのルールを確認）` : `${name} に接続できません：${err&&err.code||err}`;
    setStatus(S.errs[name], 'err');
  }));
}

function start(){
  stop();
  bootDone(); $('login').style.display='none'; $('app').style.display='';
  setStatus('接続中…'); renderFeed(); renderBadge();
  const known = new Set(S.events.map(e=>e.src+'|'+e.t+'|'+Math.floor(e.ts/60000)));
  const fresh = e => !known.has(e.src+'|'+e.t+'|'+Math.floor(e.ts/60000));

  listen('jobs', (snap, first) => {
    const out = [];
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, cur = ch.doc.data(), prev = S.jobs[id];
      if(cur && cur._sheet) return;   // 保存した「作業指示書」は作業指示ではないので通知しない
      if(ch.type === 'removed' || (cur && cur.deleted)){ dropRef('jobs/'+id); delete S.jobs[id]; return; }
      S.jobs[id] = cur;
      if(first) todayFromJob(cur).filter(fresh).forEach(e=>out.push({...e, ref:'jobs/'+id, jid:cur.id||id}));
      else diffJob(prev, cur, id).forEach(e=>out.push({...e, ref:'jobs/'+id, jid:cur.id||id}));
    });
    push(out, !first);
  });

  listen('loaner', (snap, first) => {
    const out = [];
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, cur = ch.doc.data(), prev = S.loaner[id];
      if(ch.type === 'removed'){ dropRef('loaner/'+id); delete S.loaner[id]; return; }
      if(!isBooking(id, cur)) return;
      S.loaner[id] = cur;
      if(first){ if(tsOf(cur.at) && ymd(new Date(tsOf(cur.at)))===today()) diffLoaner(null, cur, id).map(e=>({...e, ts:tsOf(cur.at), ref:'loaner/'+id})).filter(fresh).forEach(e=>out.push(e)); }
      else diffLoaner(prev, cur, id).forEach(e=>out.push({...e, ref:'loaner/'+id}));
    });
    push(out, !first);
  });

  // シートへの書き込みは通知しない（画面が埋まるため）
  // 毎朝8:30：入庫管理表のD列（入庫日）が今日の車（Apps Scriptが daily/日付 に書き込む）
  listen('daily', (snap, first) => {
    const out = [];
    snap.docChanges().forEach(ch => {
      if(ch.type === 'removed') return;
      const d = ch.doc.data() || {};
      if(d.hide){ hideAdd(d.hide); return; }   // 削除された通知の印
      if(d.date !== today()) return;          // 今日の分だけ
      const ts = tsOf(d.at) || Date.now();
      if(d.kind === 'add' || d.kind === 'future'){
        // 当日の追加入庫（8:30のあとにD列へ今日の日付）＝音あり／先の日付の入庫予定を登録＝音なし
        const mk = 'dailyadd|' + ch.doc.id, fut = d.kind === 'future', inD = d.inDate || d.date;
        const who_ = [carName(d.car), d.num].filter(Boolean).join(' ');   // お客様名はスプレッドシートだけ
        const e = {src:'daily', ic: fut ? '🗓' : '📅', c:'#c5221f', ts, quiet: fut,
          t: fut ? `入庫予定を登録（${md(inD)}）：${who_ || '（お客様名・車種 未入力）'}` : `本日の追加入庫：${who_ || '（お客様名・車種 未入力）'}`,
          d: [d.work && `作業：${d.work}`, d.cat && `区分：${d.cat}`, d.loaner && `代車：${carName(d.loaner)}`, `${d.tab} ${d.row}行目`].filter(Boolean).join('\n'),
          key:{tab:d.tab, row:d.row, num:d.num, car:d.car}, sh:{tab:d.tab, row:d.row, car:d.car, num:d.num, in:inD},
          by:who(d.by), mk, ref:'daily/'+ch.doc.id};
        const old = S.events.find(x=>x.mk===mk);
        if(old){                                  // あとから名前・車種を書いた → 同じ通知を書き換える（音なし）
          if(old.t!==e.t || old.d!==e.d){ Object.assign(old, {t:e.t, d:e.d, key:e.key, sh:e.sh, ic:e.ic}); ls.set('ark-ev', S.events.map(({live,...x})=>x)); renderFeed(); }
          return;
        }
        out.push(e);
        return;
      }
      const items = Array.isArray(d.items) ? d.items : [];
      const n = Array.isArray(d.cars) ? d.cars.length : items.length;
      // まとめの1件（音あり）＋ 1台ずつの通知（音なし）。1台ずつは、まとめのすぐ下に表スプレッドシートの順で並ぶ
      const evs = [{src:'daily', ic:'📅', c:'#c5221f', ts,
        t: n ? `本日の入庫予定：${n}台` : '本日の入庫予定はありません',
        d: n ? `${d.tab||''}${d.tab?' ／ ':''}下に1台ずつ表示しています` : (d.tab||''),
        key:{}, by:'', mk:'daily|'+d.date, ref:'daily/'+ch.doc.id}];
      for(let i=0;i<n;i++){
        // お客様名はスプレッドシートだけ（送られてきても表示しない）
        let car='', num='', work='', kind='', loan='', tab=d.tab||'', row=0;
        if(Array.isArray(d.cars)){
          car=d.cars[i]||''; num=d.nums[i]||''; work=d.works[i]||''; kind=d.kinds[i]||''; loan=d.loaners[i]||'';
          tab=(d.tabsOf&&d.tabsOf[i])||tab; row=+(d.rows&&d.rows[i])||0;
        } else continue;                               // 古い形式（名前を含む1行の文字）は出さない
        const lines = [ work && `作業：${work}`, kind && `区分：${kind}`, loan && `代車：${carName(loan)}` ].filter(Boolean);
        evs.push({src:'daily', ic:'🚗', c:'#c5221f', ts: ts - (i+1), quiet:true,
          t: `入庫予定 ${i+1}/${n}：${[carName(car), num].filter(Boolean).join(' ') || `${tab} ${row}行目`}`,
          d: lines.join('\n'), key:{tab, row, num, car}, sh:{tab, row, car, num, in:d.date}, by:'', mk:'daily|'+d.date+'|'+i, ref:'daily/'+ch.doc.id});
      }
      // 同じ日の入庫予定は、いつも新しい形で並べ直す（送り直したとき・古い形で残っていたとき）
      const old = S.events.filter(x => x.ref === 'daily/'+ch.doc.id);
      dropWhere(x => x.ref === 'daily/'+ch.doc.id);
      if(first && old.length){ const seen = Math.max(...old.map(x=>x.ts)) <= S.seen; if(seen) evs.forEach(e => { e.ts = Math.min(e.ts, S.seen); }); }   // 既読だった分は既読のまま
      for(const e of evs) out.push(e);
    });
    push(out, !first);
  });
  // コメント（ARK通知のコメント欄から）
  listen('comments', (snap, first) => {
    const out = [], me = (S.user && S.user.email) || '';
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, d = ch.doc.data() || {};
      if(ch.type === 'removed' || d.deleted){ dropRef('comments/'+id); return; }
      const ts = tsOf(d.at) || Date.now();
      if(first && ts < dayStart()) return;                      // 開いたときは今日（8:00以降）の分だけ
      if(S.events.some(x=>x.ref==='comments/'+id)) return;
      const mine = d.dev ? isMyDev(d.dev) : false;   // 同じアカウントを全員で使っているので、端末で見分ける
      // アカウント管理ができるまでは、送った端末も含めて全員の端末で鳴らす
      out.push({src:'msg', ic:'💬', c:'#0b57d0', ts, quiet: false, mine: false,
        t: d.text || '', d: '', key:{}, by: who(d.by), ref:'comments/'+id, id:'c-'+id});
    });
    push(out, !first);
  });

  listen('estimates', (snap, first) => {
    const out = [];
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, cur = ch.doc.data(), prev = S.est[id];
      if(ch.type === 'removed'){ dropRef('estimates/'+id); delete S.est[id]; return; }
      S.est[id] = cur;
      if(first){ if(tsOf(cur.at) && ymd(new Date(tsOf(cur.at)))===today()) diffEst(null, cur).map(e=>({...e, ts:tsOf(cur.at), ref:'estimates/'+id})).filter(fresh).forEach(e=>out.push(e)); }
      else diffEst(prev, cur).forEach(e=>out.push({...e, ref:'estimates/'+id}));
    });
    push(out, !first);
  });
}

  }
  function check(){
    fetch(location.pathname+'?v='+Date.now(),{method:'HEAD',cache:'no-store'}).then(function(r){
      var v=r.headers.get('etag')||r.headers.get('last-modified'); if(!r.ok||!v) return;
      if(base===null){ base=v; return; }
      if(v!==base) show();
    }).catch(function(){});
  }
  check(); setInterval(check, 5*60*1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
})();
</script>
