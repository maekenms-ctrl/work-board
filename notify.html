<script>
// パソコンのスプレッドシートのパネル（NotifyPanel.html の中）で開いたとき：
// シートの行へ移動するなどの操作を、入れ物（Apps Script）に頼む橋渡し
(function(){
  if(new URLSearchParams(location.search).get('gas')!=='1' || window.parent===window || window.google) return;
  var pend={}, seq=0;
  window.addEventListener('message',function(e){
    if(e.source!==window.parent) return; var m=e.data||{}; if(m.arkGas!==1||!pend[m.id]) return;
    var h=pend[m.id]; delete pend[m.id];
    if(m.ok){ if(h.s) h.s(m.v); } else if(h.f) h.f(new Error(m.err||'エラー'));
  });
  function runner(){
    var h={s:null,f:null}, o={};
    o.withSuccessHandler=function(fn){ h.s=fn; return p; };
    o.withFailureHandler=function(fn){ h.f=fn; return p; };
    var p=new Proxy(o,{get:function(t,k){ if(k in t) return t[k]; return function(){ var id=++seq; pend[id]=h; window.parent.postMessage({arkGas:1,id:id,fn:String(k),args:[].slice.call(arguments)},'*'); }; }});
    return p;
  }
  window.google={script:{get run(){ return runner(); }}};
})();
</script>

<script>
// iPhone：タップ位置のずれ・反応しなくなるのを防ぐ（11/7）
//  ・入力欄を押したときの自動の拡大と、2本指・2回タップでの画面全体の拡大を止める（拡大したままだと、押した所と反応する所がずれる）
//  ・キーボードを閉じたあとに画面の位置がずれたまま残るのを直す
(function(){
  var ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!ios) return;
  document.addEventListener('gesturestart',function(e){ var t=e.target; if(t&&t.closest&&t.closest('.wo-pv,.pv-stage,[data-zoom]')) return; e.preventDefault(); },{passive:false});
  var fix=function(){ setTimeout(function(){ var a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    window.scrollTo(window.scrollX,window.scrollY); try{ if(window.parent!==window) window.parent.postMessage({ark:'blur'},location.origin); }catch(e){} },150); };
  document.addEventListener('focusout',fix,true);
})();

const hideKeyOld = e => (e.ref||'') + '|' + (e.mk || e.t || '');

function push(evs, live){
  evs = evs.filter(e => !isHidden(e));
  if(!evs.length) return;
  const now = Date.now();
  evs.forEach((e,i)=>{ e.ts = e.ts || now; e.id = e.id || (now+'-'+Math.random().toString(36).slice(2,7)+i); e.live = !!live; });
  // 同じお知らせが2つ出ないように（ARK通知が自分で見つけたものと、通知の台帳から届いたもの。15分以内の同じ車・同じ内容は1つに）
  const sig = e => (e.ref||'') + '|' + (e.t||''), near = (a,b) => Math.abs((a.ts||0)-(b.ts||0)) < 15*60000;
  evs = evs.filter((e,i) => !S.events.some(x => sig(x)===sig(e) && near(x,e)) && !evs.slice(0,i).some(x => sig(x)===sig(e) && near(x,e)));
  if(!evs.length) return;
  // 入力途中の連続更新は1件にまとめる（同じ車両・同じ種類・5分以内）
  const mks = new Set(evs.filter(e=>e.mk).map(e=>e.mk));
  const keep = S.events.filter(e => !(e.mk && mks.has(e.mk) && now - e.ts < 5*60000));
  const lim = Date.now() - KEEP_DAYS*864e5;
  S.events = evs.concat(keep).filter(e=>e.ts>=lim).sort((a,b)=>b.ts-a.ts).slice(0, MAX_EV);
  ls.set('ark-ev', S.events.map(({live,...e})=>e));
  // 音を鳴らすのは「音なし」でない通知が1件でもあるときだけ
  const loud = evs.filter(e=>!e.quiet && !e.mine);   // この端末での操作から生まれた通知は音を鳴らさない
  if(live && loud.length){ beep(loud); }
  if(live){ const n = evs.filter(e=>!e.mine).length; if(n) hubSend({ark:'new', n}); }   // この端末での操作は数えない
  if(live && loud.length) deskNotify(loud);
  renderFeed(); renderBadge();
}

}

//  見積りを保存・LINE送信してから3日たっても、作業ボードに同じ車（登録番号）がない見積りを出す（30日前まで）
//  「入庫予定にした」「連絡済」「見送り」を押すと、その車の見積りに印（follow）を付けて一覧から消す。お客様名は出さない
const FOLLOW_DAYS = 3, FOLLOW_MAX = 30;
S.follow = {list:null, at:0, busy:false, err:''};
const _estPlate = e => e.plate || (e.customer && e.customer.plate) || '';
const _estCar = e => e.car || (e.customer && e.customer.car) || '';
async function loadFollow(force){
  if(!fb || !db || S.follow.busy) return;
  if(!force && S.follow.at && Date.now() - S.follow.at < 10*60000) return;   // 10分に1回だけ読む（読めなかったときも続けて読まない）
  S.follow.busy = true;
  try{
    const {F} = fb, ago = d => new Date(Date.now() - d*864e5).toISOString();
    const [es, js] = await Promise.all([
      F.getDocs(F.query(F.collection(db,'estimates'), F.where('savedAt','>=',ago(FOLLOW_MAX)))),
      F.getDocs(F.query(F.collection(db,'jobs'), F.where('createdAt','>=',ago(FOLLOW_MAX+5))))]);
    const jobs = Object.values(S.jobs); js.forEach(d => { const v = d.data(); if(v && !v._sheet && !v.deleted) jobs.push(v); });
    const lim = ago(FOLLOW_DAYS), g = {};
    es.forEach(d => {
      const e = d.data() || {}; if(!e.savedAt || e.savedAt > lim || e.follow || e.deleted) return;
      const no = plateNum(_estPlate(e)), from = new Date(Date.parse(e.savedAt) - 864e5).toISOString();
      if(no && jobs.some(j => plateNum(j.plate) === no && (!j.archived || (j.createdAt||'') >= from || (j.deliveredAt||'') >= e.savedAt))) return;   // 作業ボードに入った車
      const k = no || ('id:' + d.id);
      const x = g[k] || (g[k] = {k, no, ids:[], savedAt:'', car:'', plate:'', staff:'', grand:0});
      x.ids.push(d.id);
      if(e.savedAt > x.savedAt){ x.savedAt = e.savedAt; x.car = _estCar(e); x.plate = _estPlate(e); x.staff = e.staff || (e.customer && e.customer.staff) || ''; x.grand = +(e.grand || (e.totals && e.totals.grand) || 0); }
    });
    S.follow.list = Object.values(g).sort((a,b) => a.savedAt < b.savedAt ? -1 : 1); S.follow.at = Date.now(); S.follow.err = '';
  }catch(e){ S.follow.err = '未対応の見積りを読めませんでした'; S.follow.at = Date.now(); console.warn('未対応の見積り', e); }
  finally{ S.follow.busy = false; if(S.tab === 'today') renderToday(); }
}
async function markFollow(k, kind){
  const x = (S.follow.list||[]).find(y => y.k === k); if(!x) return;
  const {F} = fb, iso = new Date().toISOString(), by = (S.user && S.user.email) || '';
  try{
    await Promise.all(x.ids.map(id => F.setDoc(F.doc(db,'estimates',id), {follow:kind, followAt:iso, followBy:by}, {merge:true})));
    S.follow.list = S.follow.list.filter(y => y !== x); renderToday();
    toast({in:'入庫予定にしました', call:'連絡済にしました', skip:'見送りにしました'}[kind] + '（一覧から外しました）');
  }catch(e){ toast('保存できませんでした：' + (e && e.message || e), 5000); }
}
function followHtml(){
  const L = S.follow.list;
  if(!L) return S.follow.err ? `<div class="note">${esc(S.follow.err)}</div>` : '';
  let h = `<div class="sec">📝 未対応の見積り（${FOLLOW_DAYS}日以上、作業ボードに入っていない）<span class="n">${L.length}件</span></div>`;
  if(!L.length) return h + `<div class="d" style="padding:4px 10px;color:var(--sub)">なし</div>`;
  L.forEach(x => {

    h += `<div class="row fl" style="flex-wrap:wrap;cursor:default"><span class="pill" style="background:${days>=7?'#d93025':'#f29900'}">${esc(md(x.savedAt))}</span>`
      + `<span class="x">${esc([carName(x.car), x.plate].filter(Boolean).join(' ') || '（車種・番号なし）')}${x.grand?` <span class="d">${Math.round(x.grand).toLocaleString()}円</span>`:''}${x.staff?` <span class="d">担当 ${esc(x.staff)}</span>`:''} <span class="d">${days}日前</span></span>`
      + `<span style="display:flex;gap:6px;width:100%;margin-top:6px">`
      + [['in','入庫予定にした'],['call','連絡済'],['skip','見送り']].map(([v,n]) => `<button type="button" data-fl="${esc(x.k)}" data-kind="${v}" style="flex:1;padding:7px 4px;border-radius:8px;border:1px solid var(--line,#444);background:transparent;color:inherit;font:inherit;font-size:12px;cursor:pointer">${n}</button>`).join('')
      + `</span></div>`;
  });
  return h;
}
function renderToday(){
  const t = today(), jobs = Object.values(S.jobs).filter(j=>!j.archived);
  const late = jobs.filter(j=>j.dueDate && j.dueDate<t && stepNext(j)).sort((a,b)=>a.dueDate<b.dueDate?-1:1);
  const due  = jobs.filter(j=>j.dueDate===t);
  const ready= jobs.filter(j=>!stepNext(j));
  const parts= jobs.filter(j=>(j.parts||[]).some(p=>p.status==='未発注'||p.status==='発注済'));
  const byStep = STEPS.map(s=>({s, js:jobs.filter(j=>{ const n=stepNext(j); return n&&n.k===s.k; })})).filter(x=>x.js.length);
  const row = (j, pill, pc, extra='') => `<div class="row" data-num="${esc(plateNum(j.plate))}" data-car="${esc(j.car||'')}">
    <span class="pill" style="background:${pc}">${esc(pill)}</span><span class="x">${esc(carLabel(j))}</span>${extra}</div>`;
  let h = '';
  const sec = (title, n) => `<div class="sec">${title}<span class="n">${n}台</span></div>`;
  if(late.length){ h += sec('⏰ 納期遅れ', late.length); late.forEach(j=>{ h += row(j, md(j.dueDate), '#d93025', `<span class="late">${esc(stepNext(j).n)}</span>`); }); }
  h += sec('📅 今日が納期', due.length); due.forEach(j=>{ const n=stepNext(j); h += row(j, n?n.n:'完成', n?n.c:DONE_C); });
  if(!due.length) h += `<div class="d" style="padding:4px 10px;color:var(--sub)">なし</div>`;
  h += sec('🚗 完成・納車待ち', ready.length); ready.forEach(j=>{ h += row(j, '完成', DONE_C, j.dueDate?`<span class="d">${md(j.dueDate)}</span>`:''); });
  if(parts.length){ h += sec('📦 部品待ち', parts.length); parts.forEach(j=>{ const w=(j.parts||[]).filter(p=>p.status==='未発注'||p.status==='発注済'); h += row(j, w[0].status, w[0].status==='未発注'?'#d93025':'#f29900', `<span class="d">${esc(w.map(p=>p.name).join('・'))}</span>`); }); }
  h += `<div class="sec">🔧 工程ごとの台数<span class="n">作業中 ${jobs.length-ready.length}台</span></div>`;
  byStep.forEach(({s,js})=>{ h += `<div class="row" style="cursor:default"><span class="pill" style="background:${s.c}">${esc(s.n)}</span><span class="x">${js.map(carLabel).map(esc).join('、')}</span><b>${js.length}</b></div>`; });
  loadFollow();
  $('todayView').innerHTML = sheetHtml() + followHtml() + `<div class="sec" style="margin-top:18px;color:var(--sub)">── 作業ボード ──</div>` + (jobs.length ? h : `<div class="note">作業ボードの作業指示が届いていません（${S.stat.jobs?S.stat.jobs.n:0}件）。作業ボードの「設定」タブでチーム共有にログインすると表示されます。</div>`);
}

const SRC_NAME = {wb:'作業ボード', est:'見積り', loan:'代車', daily:'朝の入庫予定', msg:'コメント', sheet:'シート'};
S.snd = Object.assign({vol:60, wb:'chime', est:'pinpon', loan:'up', daily:'up', msg:'bell', sheet:'pop'}, ls.get('ark-snd', {}));
const CUSTOM = {};   // src → objectURL（自分で選んだ音声ファイル）

// 好きな音声ファイルは IndexedDB に保存（この端末のブラウザ内だけ）
function idb(){ return new Promise((ok,ng)=>{ try{ const r=indexedDB.open('ark-notify',1); r.onupgradeneeded=()=>r.result.createObjectStore('snd'); r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error); }catch(e){ ng(e); } }); }
async function idbPut(k,v){ const db=await idb(); return new Promise((ok,ng)=>{ const t=db.transaction('snd','readwrite'); v==null?t.objectStore('snd').delete(k):t.objectStore('snd').put(v,k); t.oncomplete=ok; t.onerror=()=>ng(t.error); }); }
async function idbGet(k){ const db=await idb(); return new Promise((ok,ng)=>{ const r=db.transaction('snd').objectStore('snd').get(k); r.onsuccess=()=>ok(r.result); r.onerror=()=>ng(r.error); }); }
async function loadCustom(){ for(const k of Object.keys(SRC_NAME)){ try{ const b=await idbGet('custom-'+k); if(b){ CUSTOM[k]={url:URL.createObjectURL(b.blob), name:b.name}; } }catch(e){} } }

function playSynth(key, vol){
  const def = SOUNDS[key]; if(!def || !def.notes) return;
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state==='suspended') actx.resume();
  const t0 = actx.currentTime + .02, peak = Math.max(.0002, .35 * vol);
  for(const [f, st, len, type] of def.notes){
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t0+st);
    g.gain.exponentialRampToValueAtTime(type==='square'?peak*.35:peak, t0+st+.015);
    g.gain.exponentialRampToValueAtTime(.0001, t0+st+len);
    o.connect(g).connect(actx.destination); o.start(t0+st); o.stop(t0+st+len+.05);
  }
}
function playSound(src, force){
  if(!S.sound && !force) return;
  const key = S.snd[src] || 'chime', vol = (+S.snd.vol||0)/100;
  if(key==='none' || vol<=0) return;
  try{
    if(key==='custom' && CUSTOM[src]){ const a=new Audio(CUSTOM[src].url); a.volume=Math.min(1,vol); a.play().catch(()=>{}); return; }
    if(SOUNDS[key] && SOUNDS[key].file){ const a=new Audio(SOUNDS[key].file); a.volume=Math.min(1,vol); a.play().catch(()=>{}); return; }
    playSynth(key==='custom'?'chime':key, vol);
  }catch(e){}
}
// 複数まとめて届いたときは1回だけ鳴らす（優先：代車 → 見積り → 作業ボード）
function beep(evs){
  const srcs = new Set((evs||[]).map(e=>e.src));
  if(!srcs.has('loan') && !srcs.has('est') && !srcs.has('wb') && !srcs.has('daily') && !srcs.has('msg')) return;   // シートだけなら鳴らさない
  playSound(srcs.has('msg')?'msg':srcs.has('daily')?'daily':srcs.has('loan')?'loan':srcs.has('est')?'est':'wb');
}

function renderSoundPanel(){
  const opts = cur => Object.entries(SOUNDS).map(([k,v])=>`<option value="${k}"${cur===k?' selected':''}>${v.n}</option>`).join('')
    + `<option value="custom"${cur==='custom'?' selected':''}>好きな音（ファイル）</option><option value="none"${cur==='none'?' selected':''}>鳴らさない</option>`;
  $('sndBody').innerHTML = `
    <label class="sw"><input type="checkbox" id="sndOn"${S.sound?' checked':''}> 通知音を鳴らす</label>
    <div class="sl">音量 <input type="range" id="sndVol" min="0" max="100" value="${S.snd.vol}"> <span id="sndVolN">${S.snd.vol}</span></div>
    ${Object.entries(SRC_NAME).filter(([k])=>k!=='sheet').map(([k,n])=>`
      <div class="sr"><div class="sh"><span class="src ${k}">${n}</span><button class="chip" data-test="${k}">▶ 試す</button></div>
        <select data-src="${k}">${opts(S.snd[k])}</select>
        ${S.snd[k]==='custom'?`<div class="cf">${CUSTOM[k]?`🎵 ${esc(CUSTOM[k].name)}`:'ファイルが未選択です'}
          <label class="chip">ファイルを選ぶ<input type="file" accept="audio/*" data-file="${k}" hidden></label>
          ${CUSTOM[k]?`<button class="chip" data-unset="${k}">外す</button>`:''}</div>`:''}
      </div>`).join('')}
    <div class="d" style="color:var(--sub);margin-top:8px;line-height:1.5">好きな音は mp3・wav・m4a などが使えます（3MBまで）。このパソコンのブラウザに保存されます。</div>`;
}

// ───────── シートの該当行へ ─────────
function jump(num, car){
  if(!num && !car){ return; }
  if(!(window.google && google.script && google.script.run)){ toast('（プレビュー）シートの行を探します：'+[car,num].join(' ')); return; }
  google.script.run.withSuccessHandler(r=>{
    toast(r ? `「${r.sheet}」の ${r.row} 行目を選択しました` : 'このシートには該当する車両が見つかりませんでした');
  }).withFailureHandler(e=>toast('行を探せませんでした：'+(e&&e.message||e))).findRow(num, car);
}

let fb, app, auth, db;
async function boot(){
  try{
    const [A, U, F] = await Promise.all([import(FB+'firebase-app.js'), import(FB+'firebase-auth.js'), import(FB+'firebase-firestore.js')]);
    fb = {A,U,F};
    app = A.getApps().find(a=>a.name==='notify') || A.initializeApp(CFG, 'notify');
    try{ auth = U.initializeAuth(app, {persistence:[U.indexedDBLocalPersistence, U.browserLocalPersistence, U.inMemoryPersistence]}); }
    catch(e){ auth = U.getAuth(app); }
    try{ db = F.initializeFirestore(app, {experimentalAutoDetectLongPolling:true}); }catch(e){ db = F.getFirestore(app); }
    U.onAuthStateChanged(auth, u => { S.user = u; u ? start() : showLogin(); });
  }catch(e){
    showLogin(); $('loginErr').textContent = 'Firebaseを読み込めませんでした：' + (e&&e.message||e);
  }
}
function bootDone(){ window.__ARK_READY=true; const b=$('boot'); if(b) b.remove(); }
function showLogin(){ bootDone(); stop(); $('app').style.display='none'; $('login').style.display=''; }

async function login(){
  const em = $('em').value.trim(), pw = $('pw').value;
  if(!em || !pw){ $('loginErr').textContent='メールアドレスとパスワードを入れてください'; return; }
  $('loginBtn').disabled = true; $('loginErr').textContent='';
  try{ await fb.U.signInWithEmailAndPassword(auth, em, pw); $('pw').value=''; }
  catch(e){
    const c = String(e&&e.code||'') + ' ' + String(e&&e.message||'');
    $('loginErr').textContent =
      /invalid|wrong|not-found|credential/.test(c) ? 'メールアドレスかパスワードが違います' :
      /too-many/.test(c) ? 'しばらく時間をおいてからお試しください' :
      /referer|referrer|blocked/.test(c) ? 'APIキーの「ウェブサイトの制限」でブロックされています。\nGoogle Cloud コンソールで *.googleusercontent.com を許可してください（設定手順を参照）。' :
      'ログインできませんでした：' + c;
  }finally{ $('loginBtn').disabled = false; }
}

// q：読む範囲（全件は読まない：速く・無料枠を超えないように）。key：同じ集まりを2つの範囲で読むときの見分け
function listen(name, onSnap, q, key){
  const {F} = fb; const k = key || name;
  S.first[k] = true;
  S.unsubs.push(F.onSnapshot(q || F.collection(db, name), snap => {
    // 11/9：つなぎ直したとき、最初は端末の控え（一部だけ）が届き、そのあと共有の全部が「追加」として届く。
    //  控えからの間は「最初の読み込み」として扱う（今までの車や予約を、新しい登録・予約として大量に通知しないように）
    const first = S.first[k]; if(!(snap.metadata && snap.metadata.fromCache)) S.first[k] = false;
    onSnap(snap, first);
    // パネルを閉じている間に削除されたものも、開いたときに通知から消す
    if(first && !q && name !== 'daily'){ const ids = new Set();   // 入庫予定の記録は翌朝に消すので、記録が消えても「過去」の通知は残す
      snap.docChanges().forEach(ch=>{ const v=ch.doc.data()||{}; if(ch.type!=='removed' && !v.deleted && !v._sheet) ids.add(name+'/'+ch.doc.id); });
      dropWhere(e => e.ref && e.ref.startsWith(name+'/') && !ids.has(e.ref)); }
    // 受信状況（切り分け用）：件数・最後に変更を受け取った時刻
    S.stat[name] = S.stat[name] || {n:0, last:0, log:[]};
    const st = S.stat[name]; st.n = name==='jobs' ? Object.keys(S.jobs).length : (snap.size != null ? snap.size : st.n);
    if(!first){ st.last = Date.now(); snap.docChanges().forEach(ch=>{ const d=ch.doc.data()||{}; st.log.unshift(`${new Date().toLocaleTimeString('ja-JP')} ${ch.type} ${d.car||''} ${d.plate||''} by ${who(d.by)}`); }); st.log = st.log.slice(0,30); }
    const j = S.stat.jobs || {n:0,last:0};
    if(S.errs && Object.keys(S.errs).length){ setStatus(Object.values(S.errs)[0], 'err'); return; }
    setStatus(`受信中 ・ 作業指示 ${j.n}件${j.last?` ・ 最終 ${new Date(j.last).toLocaleTimeString('ja-JP')}`:' ・ 変更待ち'}`, 'on');
    if(S.tab==='today') renderToday();
  }, err => {
    if(name==='estimates' && /permission/.test(String(err&&err.code))){ S.estDenied = true; renderFeed(); return; }
    if(name==='sheet' && /permission/.test(String(err&&err.code))){ S.sheetDenied = true; return; }
    if(name==='daily' && /permission/.test(String(err&&err.code))){ S.dailyDenied = true; return; }
    if(name==='comments' && /permission/.test(String(err&&err.code))){ S.cmtDenied = true; return; }   // ルールに daily がなくても他の通知は動かす   // ルール未設定でも他の通知は動かす
    S.errs = S.errs || {};
    const perm = /permission/.test(String(err&&err.code)), quota = /resource-exhausted|quota/i.test(String(err&&(err.code||err.message)));
    if(q && !perm && !quota){ console.warn('範囲を絞って読めないので全部を読む', name, err); listen(name, onSnap, null, k+'Full'); return; }
    S.errs[name] = perm ? `${name==='jobs'?'作業ボード':name} を読む権限がありません（Firestoreのルールを確認）` : quota ? 'Firebaseの無料枠（1日の回数）を超えました。16〜17時ごろに自動で戻ります' : `${name} に接続できません：${err&&err.code||err}`;
    setStatus(S.errs[name], 'err');
    // 受信が止まった（無料枠・一時的な障害など）：1分後につなぎ直す
    if(!perm){ clearTimeout(S._rs); S._rs = setTimeout(()=>{ try{ if(S.user) start(); }catch(e){} }, 60000); }
  }));
}

function start(){
  stop();
  const {F} = fb;
  bootDone(); $('login').style.display='none'; $('app').style.display='';
  setStatus('接続中…'); renderFeed(); renderBadge();
  const known = new Set(S.events.map(e=>e.src+'|'+e.t+'|'+Math.floor(e.ts/60000)));
  const fresh = e => !known.has(e.src+'|'+e.t+'|'+Math.floor(e.ts/60000));

  // 作業指示：作業中の車と、3日以内に納車済にした車だけを読む。作業中→納車済のときは一方から消えて、もう一方に現れる
  const JC = F.collection(db, 'jobs'), jin = {act:{}, arch:{}};
  const onJobs = part => (snap, first) => {
    const out = [];
    snap.docChanges().forEach(ch => { try{ jobChange(ch); }catch(e){ console.warn('作業指示の通知', ch.doc.id, e); } });
    push(out, !first);
    function jobChange(ch){
      const id = ch.doc.id, cur = ch.doc.data(), prev = S.jobs[id];
      if(cur && cur._sheet) return;   // 保存した「作業指示書」は作業指示ではないので通知しない
      if(ch.type === 'removed' || (cur && cur.deleted)){
        delete jin[part][id];
        // もう一方の範囲に移っただけかもしれないので、少し待ってから消す（削除・古い納車済）
        setTimeout(()=>{ if(!jin.act[id] && !jin.arch[id]){ dropRef('jobs/'+id); delete S.jobs[id]; } }, 2500);
        return;
      }
      jin[part][id] = true;
      if(prev && prev.updatedAt && cur.updatedAt && prev.updatedAt === cur.updatedAt && prev.archived === cur.archived){ S.jobs[id] = cur; return; }   // 同じ内容がもう一方の範囲から届いた
      S.jobs[id] = cur;
      if(first && !prev) todayFromJob(cur).filter(fresh).forEach(e=>out.push({...e, ref:'jobs/'+id, jid:cur.id||id}));
      else diffJob(prev, cur, id).forEach(e=>out.push({...e, ref:'jobs/'+id, jid:cur.id||id}));
    }
  };
  const ago = d => new Date(Date.now() - d*864e5).toISOString();
  listen('jobs', onJobs('act'), F.query(JC, F.where('archived','==',false)), 'jobs');
  listen('jobs', onJobs('arch'), F.query(JC, F.where('deliveredAt','>=',ago(3))), 'jobsArch');
  // 削除された作業指示（閉じている間に削除されたものも、通知から消す）
  listen('jobs', (snap) => { snap.docChanges().forEach(ch => { if(ch.type !== 'removed'){ dropRef('jobs/'+ch.doc.id); delete S.jobs[ch.doc.id]; } }); }, F.query(JC, F.where('deleted','==',true)), 'jobsDel');

  listen('loaner', (snap, first) => {
    const out = [];
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, cur = ch.doc.data(), prev = S.loaner[id];
      if(ch.type === 'removed'){ dropRef('loaner/'+id); delete S.loaner[id]; return; }
      if(!isBooking(id, cur)) return;
      S.loaner[id] = cur;
      if(first){ if(tsOf(cur.at) && ymd(new Date(tsOf(cur.at)))===today()) diffLoaner(null, cur, id).map(e=>({...e, ts:tsOf(cur.at), ref:'loaner/'+id})).filter(fresh).forEach(e=>out.push(e)); }
      else diffLoaner(prev, cur, id).forEach(e=>out.push({...e, ref:'loaner/'+id}));
    });
    push(out, !first);
  });

  // シートへの書き込みは通知しない（画面が埋まるため）
  // 毎朝8:30：入庫管理表のD列（入庫日）が今日の車（Apps Scriptが daily/日付 に書き込む）
  listen('daily', (snap, first) => {
    const out = [];
    snap.docChanges().forEach(ch => {
      if(ch.type === 'removed') return;
      const d = ch.doc.data() || {};
      if(d.hide){ hideAdd(d.hide); return; }   // 削除された通知の印
      if(d.date !== today()) return;          // 今日の分だけ
      const ts = tsOf(d.at) || Date.now();
      if(d.kind === 'add' || d.kind === 'future'){
        // 当日の追加入庫（8:30のあとにD列へ今日の日付）＝音あり／先の日付の入庫予定を登録＝音なし
        const mk = 'dailyadd|' + ch.doc.id, fut = d.kind === 'future', inD = d.inDate || d.date;
        const who_ = [carName(d.car), d.num].filter(Boolean).join(' ');   // お客様名はスプレッドシートだけ
        const e = {src:'daily', ic: fut ? '🗓' : '📅', c:'#c5221f', ts, quiet: fut,
          t: fut ? `入庫予定を登録（${md(inD)}）：${who_ || '（お客様名・車種 未入力）'}` : `本日の追加入庫：${who_ || '（お客様名・車種 未入力）'}`,
          d: [d.work && `作業：${d.work}`, d.cat && `区分：${d.cat}`, d.loaner && `代車：${carName(d.loaner)}`, `${d.tab} ${d.row}行目`].filter(Boolean).join('\n'),
          key:{tab:d.tab, row:d.row, num:d.num, car:d.car}, sh:{tab:d.tab, row:d.row, car:d.car, num:d.num, in:inD},
          by:who(d.by), mk, ref:'daily/'+ch.doc.id};
        const old = S.events.find(x=>x.mk===mk);
        if(old){                                  // あとから名前・車種を書いた → 同じ通知を書き換える（音なし）
          if(old.t!==e.t || old.d!==e.d){ Object.assign(old, {t:e.t, d:e.d, key:e.key, sh:e.sh, ic:e.ic}); ls.set('ark-ev', S.events.map(({live,...x})=>x)); renderFeed(); }
          return;
        }
        out.push(e);
        return;
      }
      const items = Array.isArray(d.items) ? d.items : [];
      const n = Array.isArray(d.cars) ? d.cars.length : items.length;
      // まとめの1件（音あり）＋ 1台ずつの通知（音なし）。1台ずつは、まとめのすぐ下に表スプレッドシートの順で並ぶ
      const evs = [{src:'daily', ic:'📅', c:'#c5221f', ts,
        t: n ? `本日の入庫予定：${n}台` : '本日の入庫予定はありません',
        d: n ? `${d.tab||''}${d.tab?' ／ ':''}下に1台ずつ表示しています` : (d.tab||''),
        key:{}, by:'', mk:'daily|'+d.date, ref:'daily/'+ch.doc.id}];
      for(let i=0;i<n;i++){
        // お客様名はスプレッドシートだけ（送られてきても表示しない）
        let car='', num='', work='', kind='', loan='', tab=d.tab||'', row=0;
        if(Array.isArray(d.cars)){
          car=d.cars[i]||''; num=d.nums[i]||''; work=d.works[i]||''; kind=d.kinds[i]||''; loan=d.loaners[i]||'';
          tab=(d.tabsOf&&d.tabsOf[i])||tab; row=+(d.rows&&d.rows[i])||0;
        } else continue;                               // 古い形式（名前を含む1行の文字）は出さない
        const lines = [ work && `作業：${work}`, kind && `区分：${kind}`, loan && `代車：${carName(loan)}` ].filter(Boolean);
        evs.push({src:'daily', ic:'🚗', c:'#c5221f', ts: ts - (i+1), quiet:true,
          t: `入庫予定 ${i+1}/${n}：${[carName(car), num].filter(Boolean).join(' ') || `${tab} ${row}行目`}`,
          d: lines.join('\n'), key:{tab, row, num, car}, sh:{tab, row, car, num, in:d.date}, by:'', mk:'daily|'+d.date+'|'+i, ref:'daily/'+ch.doc.id});
      }
      // 同じ日の入庫予定は、いつも新しい形で並べ直す（送り直したとき・古い形で残っていたとき）
      const old = S.events.filter(x => x.ref === 'daily/'+ch.doc.id);
      dropWhere(x => x.ref === 'daily/'+ch.doc.id);
      if(first && old.length){ const seen = Math.max(...old.map(x=>x.ts)) <= S.seen; if(seen) evs.forEach(e => { e.ts = Math.min(e.ts, S.seen); }); }   // 既読だった分は既読のまま
      for(const e of evs) out.push(e);
    });
    push(out, !first);
  });
  // コメント（ARK通知のコメント欄から）
  const ymdAgo = d => ymd(new Date(Date.now() - d*864e5));
  listen('comments', (snap, first) => {
    const out = [], me = (S.user && S.user.email) || '';
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, d = ch.doc.data() || {};
      if(ch.type === 'removed' || d.deleted){ dropRef('comments/'+id); delete S.pushWait[id]; return; }
      // プッシュ通知の送り状況（11/9）：Apps Script が送ると push が 'done' になる
      if(d.push === 'wait') S.pushWait[id] = tsOf(d.at) || Date.now(); else delete S.pushWait[id];
      if(d.push === 'done') S.pushOk = Math.max(S.pushOk||0, tsOf(d.pushAt) || Date.parse(d.pushAt||'') || Date.now());
      if(d.push === 'err' && (tsOf(d.at)||0) > Date.now() - 6*3600e3) S.pushErr = d.pushErr || '送れませんでした';
      pushWarnPaint();
      // 通知の台帳（11/9）：作業ボード・見積りツールが残した大事な変化。閉じていた間の分も、開いたときに全部出す
      if(d.kind === 'ev'){
        if(ch.type !== 'added' || d.to || d.pushOnly) return;   // 送り状況の書き換え・テスト通知・プッシュ通知だけの分（入庫予定は別に出る）は出さない
        if(S.events.some(x => x.lid === id)) return;
        out.push({src: d.src || 'wb', ic: d.ic || '🔔', c: d.c || '#0b57d0', ts: Date.parse(d.ts||'') || tsOf(d.at) || Date.now(), quiet: !!d.quiet, mine: isMyDev(d.dev),
          t: d.t || '', d: d.d || '', key: d.key || {}, by: who(d.by), ref: d.ref || ('comments/'+id), jid: d.jid || '', lid: id});
        return;
      }
      if(ch.type === 'modified') return;                      // 送り状況の書き換えだけ
      const ts = tsOf(d.at) || Date.now();
      if(first && ts < dayStart()) return;                      // 開いたときは今日（8:00以降）の分だけ
      if(S.events.some(x=>x.ref==='comments/'+id)) return;
      const mine = d.dev ? isMyDev(d.dev) : false;   // 同じアカウントを全員で使っているので、端末で見分ける
      // アカウント管理ができるまでは、送った端末も含めて全員の端末で鳴らす
      out.push({src:'msg', ic:'💬', c:'#0b57d0', ts, quiet: false, mine: false,
        t: d.text || '', d: '', key:{}, by: who(d.by), ref:'comments/'+id, id:'c-'+id});
    });
    push(out, !first);
  }, F.query(F.collection(db,'comments'), F.where('date','>=',ymdAgo(1))));

  listen('estimates', (snap, first) => {
    const out = [];
    snap.docChanges().forEach(ch => {
      const id = ch.doc.id, cur = ch.doc.data(), prev = S.est[id];
      if(ch.type === 'removed'){ dropRef('estimates/'+id); delete S.est[id]; return; }
      S.est[id] = cur;
      if(first){ if(tsOf(cur.at) && ymd(new Date(tsOf(cur.at)))===today()) diffEst(null, cur).map(e=>({...e, ts:tsOf(cur.at), ref:'estimates/'+id})).filter(fresh).forEach(e=>out.push(e)); }
      else diffEst(prev, cur).forEach(e=>out.push({...e, ref:'estimates/'+id}));
    });
    push(out, !first);
  }, F.query(F.collection(db,'estimates'), F.where('savedAt','>=',ago(3))));
}
// スリープ・別のアプリから戻ったとき、電波が戻ったとき：すぐつなぎ直す
let _ntHid = 0;
function reconnect(){ try{ if(!fb || !db || !S.unsubs.length || !fb.F.disableNetwork) return; fb.F.disableNetwork(db).then(()=>fb.F.enableNetwork(db)).catch(()=>{}); }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ _ntHid = Date.now(); return; } if(_ntHid && Date.now()-_ntHid > 8000) reconnect(); _ntHid = 0; });
window.addEventListener('online', reconnect);
function stop(){ S.errs = {}; S.unsubs.forEach(f=>{ try{ f(); }catch(e){} }); S.unsubs = []; S.jobs = {}; S.loaner = {}; S.est = {}; }

// ───────── コメント欄 ─────────
async function sendComment(){
  const ta = $('cmtText'), text = ta.value.trim();
  if(!text) return;
  if(S.cmtDenied){ toast('コメントを送る権限がありません。Firestoreのルールに comments を追加してください', 7000); return; }
  const {F} = fb; $('cmtSend').disabled = true;
  try{
    await F.addDoc(F.collection(db, 'comments'), {text: text.slice(0,300), by: (S.user && S.user.email) || '', dev: MY_DEV, at: F.serverTimestamp(), date: today(), push: 'wait'});   // push：Apps Script がプッシュ通知で全員へ送る（11/9）
    ta.value = ''; cmtSize(); toast('コメントを送りました');
  }catch(e){
    toast(/permission/.test(String(e&&e.code)) ? 'コメントを送る権限がありません。Firestoreのルールに comments を追加してください' : 'コメントを送れませんでした：' + (e&&e.code||e), 7000);
  }finally{ $('cmtSend').disabled = !$('cmtText').value.trim(); }
}
async function delComment(ref){
  const id = String(ref||'').split('/')[1]; if(!id) return;
  try{ const {F} = fb; await F.deleteDoc(F.doc(db, 'comments', id)); toast('コメントを取り消しました'); }
  catch(e){ toast('取り消せませんでした：' + (e&&e.code||e), 5000); }
}
function cmtSize(){ const t=$('cmtText'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight, 120)+'px'; $('cmtSend').disabled = !t.value.trim(); }
$('cmtForm').addEventListener('submit', e => { e.preventDefault(); sendComment(); });
$('cmtText').addEventListener('input', cmtSize);
$('cmtText').addEventListener('keydown', e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); sendComment(); } });
document.addEventListener('click', e => { const b = e.target.closest('button.cdel'); if(b){ e.stopPropagation(); delComment(b.dataset.del); } }, true);
// 🗑：1回目で「全員から削除」の確認に変わり、もう1回押すと削除（4秒で元に戻る）
document.addEventListener('click', e => {
  const b = e.target.closest('button.evdel'); if(!b) return;
  e.stopPropagation(); e.preventDefault();
  if(b.classList.contains('ask')){ b.disabled = true; delEvent(b.dataset.evdel); return; }
  document.querySelectorAll('button.evdel.ask').forEach(x=>{ x.classList.remove('ask'); x.textContent='🗑'; });
  b.classList.add('ask'); b.textContent = '全員の画面から削除';
  setTimeout(()=>{ if(b.isConnected && b.classList.contains('ask')){ b.classList.remove('ask'); b.textContent='🗑'; } }, 4000);
}, true);

$('feed').addEventListener('click', e => {

});

$('pastView').addEventListener('click', e => {
  if(hubLink(e)) return;
  const el = e.target.closest('.ev'); if(!el) return;
  const ev = S.events.find(x=>x.id===el.dataset.id); if(!ev) return;
  if((ev.src==='sheet'||ev.src==='daily') && ev.key && (ev.key.tab||ev.key.car)){ sheetGo(ev.key); return; }
  jump(ev.key&&ev.key.num, ev.key&&ev.key.car);
});
$('todayView').addEventListener('click', e => {
  if(e.target.id==='sheetReload'){ S.sheet=null; renderToday(); loadSheetToday(); return; }
  const fl = e.target.closest('[data-fl]'); if(fl){ fl.disabled = true; markFollow(fl.dataset.fl, fl.dataset.kind); return; }
  const sr = e.target.closest('.row[data-row]');
  if(sr && window.google && google.script){ google.script.run.withSuccessHandler(x=>toast(`${x.row} 行目を選択しました`)).selectRow(+sr.dataset.row); return; }
  const r = e.target.closest('.row[data-num]'); if(r) jump(r.dataset.num, r.dataset.car); });
$('soundBtn').onclick = e => { e.stopPropagation(); renderSoundPanel(); $('sndPanel').classList.add('on'); };
$('sndClose').onclick = () => $('sndPanel').classList.remove('on');
$('sndPanel').addEventListener('click', e => e.stopPropagation());
const saveSnd = () => ls.set('ark-snd', S.snd);
$('sndBody').addEventListener('input', e => {
  if(e.target.id==='sndVol'){ S.snd.vol=+e.target.value; $('sndVolN').textContent=S.snd.vol; saveSnd(); }
});
$('sndBody').addEventListener('change', async e => {
  const t = e.target;
  if(t.id==='sndOn'){ S.sound=t.checked; ls.set('ark-sound', S.sound); $('soundBtn').textContent=S.sound?'🔔':'🔕'; }
  if(t.id==='sndVol'){ playSound('wb', true); }
  if(t.dataset.src){ S.snd[t.dataset.src]=t.value; saveSnd(); renderSoundPanel(); if(t.value!=='custom') playSound(t.dataset.src, true); }
  if(t.dataset.file){
    const k=t.dataset.file, f=t.files&&t.files[0]; if(!f) return;
    if(f.size>3*1024*1024){ toast('3MB以下の音声ファイルを選んでください'); return; }
    try{ await idbPut('custom-'+k, {blob:f, name:f.name}); if(CUSTOM[k]) URL.revokeObjectURL(CUSTOM[k].url); CUSTOM[k]={url:URL.createObjectURL(f), name:f.name}; renderSoundPanel(); playSound(k, true); toast('「'+f.name+'」を設定しました'); }
    catch(err){ toast('保存できませんでした：'+(err&&err.message||err)); }
  }
});
$('sndBody').addEventListener('click', async e => {
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.test) playSound(t.dataset.test, true);
  if(t.dataset.unset){ const k=t.dataset.unset; try{ await idbPut('custom-'+k, null); }catch(err){} if(CUSTOM[k]) URL.revokeObjectURL(CUSTOM[k].url); delete CUSTOM[k]; renderSoundPanel(); }
});
loadCustom();

// ───────── タブレット・単独ページ向け ─────────
// スマホ・タブレットは「一度タップ」しないと音が鳴らないため、案内を出してタップで有効化
const IN_SHEET = !!(window.google && google.script && google.script.run);
let audioReady = false, wakeLock = null;
async function keepAwake(){
  if(IN_SHEET || !('wakeLock' in navigator)) return;
  try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function unlockAudio(){
  if(audioReady) return; audioReady = true;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume(); const b=actx.createBuffer(1,1,22050), src=actx.createBufferSource(); src.buffer=b; src.connect(actx.destination); src.start(0); }catch(e){}
  const el = $('tapNote'); if(el) el.remove();
  keepAwake();
}
document.addEventListener('pointerdown', unlockAudio, {once:false, capture:true});
document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible' && audioReady) keepAwake(); });
if(!IN_SHEET){
  const n = document.createElement('div'); n.id='tapNote'; n.className='tapnote';
  n.innerHTML = '🔈 画面をどこか1回タップすると、通知音が鳴るようになります<br><span>（あわせて画面が自動で消えないようにします）</span>';
  document.body.appendChild(n);
}
$('soundBtn').textContent = S.sound ? '🔔' : '🔕';
deskLabel();
$('menuBtn').onclick = e => { e.stopPropagation(); $('menu').classList.toggle('on'); };
document.addEventListener('click', () => { $('menu').classList.remove('on'); $('sndPanel').classList.remove('on'); });
$('menu').addEventListener('click', async e => {
  const a = e.target.dataset.act; if(!a) return;
  if(a==='desk'){ await deskToggle(); return; }
  if(a==='log'){
    const L = ['jobs','loaner','estimates'].map(n=>{ const st=S.stat[n]; return `■ ${n}：${st?st.n+'件':'未受信'}\n` + (st&&st.log.length?st.log.join('\n'):'（パネルを開いてから変更なし）'); }).join('\n\n');
    alert(L);
  }
  if(a==='read'){ S.seen = Date.now(); ls.set('ark-seen', S.seen); renderFeed(); renderBadge(); }
  if(a==='clear'){ S.events = []; ls.set('ark-ev', []); renderFeed(); renderBadge(); }
  if(a==='logout'){ try{ await fb.U.signOut(auth); }catch(err){} }
});
// パネルを見ている間は既読にする（20秒後）
// 8:00をまたいだら「通知」を区切り直す
let _lastStart = dayStart();
setInterval(() => { const d = dayStart(); if(d !== _lastStart){ _lastStart = d; renderFeed(); renderBadge(); } }, 30000);
setInterval(() => { if(document.visibilityState==='visible' && S.tab==='feed'){ const n=Date.now()-20000; if(n>S.seen){ S.seen=n; ls.set('ark-seen', S.seen); renderBadge(); } } }, 10000);
// 日付が変わったら「今日の状況」を更新
setInterval(() => { if(S.tab==='today'){ loadSheetToday(); renderToday(); } }, 60000);

window.__ARK = {diffJob, diffLoaner, diffEst, todayFromJob, plateNum, carLabel, S, push};
boot();
</script>
<script>
// ── 新しい版のお知らせ：GitHubのファイルが新しくなったら、画面の下に「更新する」を出す ──
(function(){
  if(!/github\.io$/.test(location.hostname) || !window.fetch) return;
  var base=null, shown=false;
  function show(){
    if(shown) return; shown=true;
    var b=document.createElement('div');
    b.setAttribute('style','position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147483000;background:#0b57d0;color:#fff;border-radius:22px;padding:8px 8px 8px 16px;font:700 14px/1.4 "Noto Sans JP",sans-serif;display:flex;gap:10px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.35);max-width:calc(100% - 24px)');
    b.innerHTML='<span>新しい版があります</span><button type="button" style="border:0;border-radius:16px;background:#fff;color:#0b57d0;font:inherit;padding:6px 14px;cursor:pointer">更新する</button>';
    b.querySelector('button').onclick=function(){ location.reload(); };
    document.body.appendChild(b);
  }
  // 11/9：前は、GitHubの「最終更新の印」を比べていた。GitHubはどれか1つのファイルを入れ直すと全部の印が変わるため、
  //  中身が変わっていないのに「新しい版」と何度も出ていた。→ ファイルの頭に書いた版の番号（ark-ver）だけを読んで比べる
  var mine=(document.querySelector('meta[name="ark-ver"]')||{}).content||'';
  function check(){
    if(!mine) return;
    fetch(location.pathname+'?v='+Date.now(),{cache:'no-store',headers:{Range:'bytes=0-4095'}}).then(function(r){
      if(!r.ok) return null; return r.text();
    }).then(function(t){
      if(!t) return; var m=t.slice(0,8192).match(/<meta name="ark-ver" content="([^"]+)"/); if(!m) return;
      if(m[1]!==mine) show();
    }).catch(function(){});
  }
  check(); setInterval(check, 5*60*1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
})();
</script>
