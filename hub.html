<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1d21">
<title>作業ボード＋通知</title>
<link rel="manifest" href="hub.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
  :root{--bar:#1a1d21;--ink:#e8eaed;--sub:#9aa0a6;--acc:#e4ff1a;--red:#ff4d4d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bar);overflow:hidden;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",sans-serif}
  .bar{position:fixed;left:0;right:0;top:0;height:46px;padding:5px 6px env(safe-area-inset-top);display:flex;gap:6px;background:var(--bar);border-bottom:1px solid #2c3036;z-index:2}
  .sw{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid #3a3f46;border-radius:10px;background:#23272d;color:var(--sub);font:inherit;font-size:15px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
  .sw.on{background:var(--acc);border-color:var(--acc);color:#111}
  .dot{display:none;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;line-height:20px;font-weight:800}
  .dot.show{display:inline-block}
  .sw.on .dot{display:none}
  .pane{position:fixed;left:0;right:0;top:46px;bottom:0;border:0;width:100%;height:calc(100% - 46px);background:#fff;visibility:hidden}
  .pane.on{visibility:visible}
  #board{background:#1a1d21}
</style>
<style>html{touch-action:pan-x pan-y;}button,.btn,.selbtn,.tab-btn,.sw{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}</style>
<script>
// iPhone：タップ位置のずれ・反応しなくなるのを防ぐ（11/7）
//  ・入力欄を押したときの自動の拡大と、2本指・2回タップでの画面全体の拡大を止める（拡大したままだと、押した所と反応する所がずれる）
//  ・キーボードを閉じたあとに画面の位置がずれたまま残るのを直す
(function(){
  var ios=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!ios) return;
  document.addEventListener('gesturestart',function(e){ var t=e.target; if(t&&t.closest&&t.closest('.wo-pv,.pv-stage,[data-zoom]')) return; e.preventDefault(); },{passive:false});
  var fix=function(){ setTimeout(function(){ var a=document.activeElement; if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    window.scrollTo(window.scrollX,window.scrollY); try{ if(window.parent!==window) window.parent.postMessage({ark:'blur'},location.origin); }catch(e){} },150); };
  document.addEventListener('focusout',fix,true);
})();
</script>
</head>
<body>
<div class="bar">
  <button class="sw" id="b-board" type="button">🛠 作業ボード</button>
  <button class="sw" id="b-notify" type="button">📣 ARK通知 <span class="dot" id="dot"></span></button>
</div>
<!-- どちらも読み込んだまま切り替える（ARK通知は裏でも受信・通知音あり） -->
<iframe class="pane" id="board" src="./index.html" title="作業ボード" allow="autoplay; screen-wake-lock; clipboard-write; camera"></iframe>
<iframe class="pane" id="notify" src="./notify.html" title="ARK通知" allow="autoplay; screen-wake-lock"></iframe>
<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var cur='', unseen=0;
  function show(k){
    cur=k;
    $('board').classList.toggle('on',k==='board'); $('notify').classList.toggle('on',k==='notify');
    $('b-board').classList.toggle('on',k==='board'); $('b-notify').classList.toggle('on',k==='notify');
    if(k==='notify'){ unseen=0; badge(); }
    // 見えていない方の画面は描き直しを止める（同じ画面の中で2つが動くと、押しても反応が遅れるため。11/7）
    try{ $('notify').contentWindow.postMessage({ark:'vis',on:k==='notify'},location.origin); }catch(e){}
    try{ $('board').contentWindow.postMessage({ark:'vis',on:k==='board'},location.origin); }catch(e){}
    try{ localStorage.setItem('hub-tab',k); }catch(e){}
  }
  function badge(){ var d=$('dot'); d.textContent=unseen>99?'99+':unseen; d.classList.toggle('show',unseen>0); }
  $('b-board').onclick=function(){ show('board'); };
  $('b-notify').onclick=function(){ show('notify'); };
  // ARK通知からの合図：新しい通知／作業ボードで開く
  addEventListener('message',function(e){
    if(e.origin!==location.origin) return;
    var m=e.data||{};
    if(m.ark==='blur'){ resetPos(); return; }
    if(m.ark==='ready'){ show(cur); return; }
    if(m.ark==='new' && cur!=='notify'){ unseen+=m.n||1; badge(); }
    if(m.ark==='openJob' && m.jid){
      try{ $('board').contentWindow.location.hash='job='+encodeURIComponent(m.jid); }catch(err){ $('board').src='./index.html#job='+encodeURIComponent(m.jid); }
      show('board');
    }
    if(m.ark==='openHash' && m.hash){
      try{ $('board').contentWindow.location.hash=m.hash; }catch(err){ $('board').src='./index.html#'+m.hash; }
      show('board');
    }
    if(m.ark==='openEst'){ window.open('https://maekenms-ctrl.github.io/estimate-tool/','_blank','noopener'); }
  });
  // iPhone：キーボードを閉じたあと、画面全体が上にずれたまま残る（押した所と反応する所がずれる）のを元の位置に戻す（11/7）
  function resetPos(){ setTimeout(function(){ if(window.scrollX||window.scrollY) window.scrollTo(0,0); var se=document.scrollingElement; if(se&&se.scrollTop) se.scrollTop=0; },60); }
  if(window.visualViewport){ var vh=0; visualViewport.addEventListener('resize',function(){ var h=visualViewport.height; if(h>vh+80) resetPos(); vh=h; }); }
  addEventListener('scroll',function(){ if(window.scrollY&&(!window.visualViewport||visualViewport.height>innerHeight*0.85)) resetPos(); },{passive:true});
  $('notify').addEventListener('load',function(){ show(cur); }); $('board').addEventListener('load',function(){ show(cur); });
  var first='board'; try{ first=localStorage.getItem('hub-tab')||'board'; }catch(e){}
  show(first==='notify'?'notify':'board');
  if('serviceWorker' in navigator && location.protocol==='https:') addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
</script>
<script>
// ── 新しい版のお知らせ：GitHubのファイルが新しくなったら、画面の下に「更新する」を出す ──
(function(){
  if(!/github\.io$/.test(location.hostname) || !window.fetch) return;
  var base=null, shown=false;
  function show(){
    if(shown) return; shown=true;
    var b=document.createElement('div');
    b.setAttribute('style','position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2147483000;background:#0b57d0;color:#fff;border-radius:22px;padding:8px 8px 8px 16px;font:700 14px/1.4 "Noto Sans JP",sans-serif;display:flex;gap:10px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.35);max-width:calc(100% - 24px)');
    b.innerHTML='<span>新しい版があります</span><button type="button" style="border:0;border-radius:16px;background:#fff;color:#0b57d0;font:inherit;padding:6px 14px;cursor:pointer">更新する</button>';
    b.querySelector('button').onclick=function(){ location.reload(); };
    document.body.appendChild(b);
  }
  function check(){
    fetch(location.pathname+'?v='+Date.now(),{method:'HEAD',cache:'no-store'}).then(function(r){
      var v=r.headers.get('etag')||r.headers.get('last-modified'); if(!r.ok||!v) return;
      if(base===null){ base=v; return; }
      if(v!==base) show();
    }).catch(function(){});
  }
  check(); setInterval(check, 5*60*1000);
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') check(); });
})();
</script>
</body>
</html>
